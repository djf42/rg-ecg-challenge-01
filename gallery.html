<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rhythm review · ECG Rhythm Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brand.css?v=2026-10-04b">
<style>
  .wrap.wide{max-width:1040px}
  .item{margin:0 0 26px}
  .item h3{margin:0 0 2px}
  .item p{margin:0 0 8px;font-size:16px;color:var(--ink-muted)}
  .mon{position:relative;height:170px;background:var(--navy);border-radius:var(--radius-md);overflow:hidden}
  .mon canvas{position:absolute;inset:0;width:100%;height:100%}
  .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:var(--radius-pill);margin-left:8px;vertical-align:3px}
  .chip.shock{background:var(--red);color:#fff}.chip.noshock{background:var(--mist);color:var(--navy)}
</style>
</head>
<body>
<div class="wrap wide">
  <section class="sheet">
    <p class="eyebrow">ECG Rhythm Challenge</p>
    <h1>Rhythm review</h1>
    <p class="muted">Every rhythm in the game, as a 5-second strip. Each play shows slight variations in amplitude and phase, but the rates and shapes stay the same. This page isn't linked from the game.</p>
    <div id="list"></div>
  </section>
</div>
<script src="js/rhythms.js?v=2026-10-04b"></script>
<script src="js/monitor.js?v=2026-10-04b"></script>
<script>
const L = window.RHYTHM_LIB, list = document.getElementById("list");
const items = [{ key: "artifact", title: "Chest-compression artifact (first 3 seconds of each round)", detail: "About 110 compressions/min", sig: t => L.compressionArtifact(t, 1.3), hr: "---" }]
  .concat(L.RHYTHMS.map(r => ({ key: r.key, title: L.catOf(r.cat).label, detail: r.detail, cat: L.catOf(r.cat), sig: (t => r.fn(t, L.variant(3.7))), hr: L.hrDescribe(r) })));
items.forEach(it => {
  const d = document.createElement("div"); d.className = "item";
  const h = document.createElement("h3"); h.textContent = it.title;
  if (it.cat) { const c = document.createElement("span"); c.className = "chip " + (it.cat.shockable ? "shock" : "noshock"); c.textContent = it.cat.shockable ? "Shockable" : (it.cat.key === "rosc" ? "Perfusing rhythm" : "Non-shockable"); h.appendChild(c); }
  const p = document.createElement("p"); p.textContent = it.detail + "  ·  monitor HR: " + it.hr + (it.key !== "artifact" ? "  ·  key: " + it.key : "");
  const mon = document.createElement("div"); mon.className = "mon"; const cv = document.createElement("canvas"); mon.appendChild(cv);
  d.append(h, p, mon); list.appendChild(d);
  requestAnimationFrame(() => Monitor.strip(Monitor.setup(cv), it.sig, 2));
});
</script>
</body>
</html>
